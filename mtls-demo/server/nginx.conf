server {
    listen 443 ssl;
    server_name mtls-server localhost;

    # ── Server identity (one-way TLS) ─────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/server/server.crt;
    ssl_certificate_key /etc/nginx/certs/server/server.key;

    # ── mTLS: require a valid client certificate ──────────────────────────────
    ssl_client_certificate /etc/nginx/certs/ca/ca.crt;
    ssl_verify_client      on;       # reject connections without a valid client cert
    ssl_verify_depth       2;        # allow CA → intermediate → client chains

    # ── Protocol & cipher hardening ───────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    root  /usr/share/nginx/html;
    index index.html;

    # ── API: expose TLS session variables as JSON ──────────────────────────────
    # The Flask client fetches this to show live connection metadata.
    location /api/cert-info {
        add_header Content-Type  'application/json; charset=utf-8' always;
        add_header Cache-Control 'no-store' always;
        return 200 '{"verify":"$ssl_client_verify","subject":"$ssl_client_s_dn","issuer":"$ssl_client_i_dn","serial":"$ssl_client_serial","fingerprint":"$ssl_client_fingerprint","protocol":"$ssl_protocol","cipher":"$ssl_cipher","session_reused":"$ssl_session_reused","server_name":"mtls-server"}';
    }

    # ── Static pages (only reachable after mTLS auth) ─────────────────────────
    location / {
        try_files $uri $uri/ =404;
        # Expose TLS metadata as response headers for DevTools inspection
        add_header X-Client-Verify  $ssl_client_verify  always;
        add_header X-Client-Subject $ssl_client_s_dn    always;
        add_header X-TLS-Protocol   $ssl_protocol       always;
        add_header X-TLS-Cipher     $ssl_cipher         always;
    }

    # Custom error page when client cert is missing or invalid
    error_page 400 495 496 497 /tls-error.html;
    location = /tls-error.html {
        root /usr/share/nginx/html;
        internal;
    }
}
