services:

  # ── Step 1: generate CA + server + client certificates ─────────────────────
  generate-certs:
    image: alpine
    command: >
      sh -c "apk add --no-cache openssl > /dev/null 2>&1 && sh /scripts/generate-certs.sh"
    volumes:
      - ./generate-certs.sh:/scripts/generate-certs.sh:ro
      - ./certs:/certs

  # ── Nginx server with mTLS ──────────────────────────────────────────────────
  mtls-server:
    image: nginx:alpine
    container_name: mtls-server
    depends_on:
      generate-certs:
        condition: service_completed_successfully
    volumes:
      - ./server/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./server/html:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "8443:443"   # expose so browser can try (and fail!) direct mTLS
    networks:
      - mtls-net

  # ── Python client app (the interactive browser UI) ──────────────────────────
  mtls-client:
    build: ./client
    container_name: mtls-client
    depends_on:
      generate-certs:
        condition: service_completed_successfully
      mtls-server:
        condition: service_started
    volumes:
      - ./certs:/app/certs:ro
    ports:
      - "8888:8888"
    environment:
      - SERVER_HOST=mtls-server
      - SERVER_PORT=443
      - CERTS_DIR=/app/certs
    networks:
      - mtls-net

networks:
  mtls-net:
    driver: bridge
