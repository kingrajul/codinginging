server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------
    # INTENTIONALLY NO SECURITY HEADERS — demo only
    # Do NOT use this config in production.
    # -------------------------------------------------------

    location / {
        try_files $uri $uri/ =404;
    }

    # Serve the "evil upload" endpoint: returns uploaded file
    # content with whatever Content-Type the uploader chose.
    # This enables the MIME-sniffing demo.
    location /upload {
        add_header Content-Type "text/plain" always;
        return 200 "upload endpoint (demo only)";
    }

    # Endpoint that deliberately serves JS as text/plain so browsers
    # that sniff MIME types will still execute it.
    location /mime-demo.js {
        add_header Content-Type "text/plain" always;
        alias /usr/share/nginx/html/mime-demo.js;
    }
}
